name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run (chrome or firefox)"
        required: false
        default: "chrome"
      baseUrl:
        description: "Override BASE_URL (optional)"
        required: false

jobs:
  wdio:
    name: Run WDIO E2E tests and publish report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Java for Allure report generation
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies (UI tests)
        run: npm ci --ignore-scripts

      # Optional: override base URL via repository/environment variable
      - name: Run WDIO test
        env:
          BROWSER: chrome
          BASE_URL: ${{ inputs.baseUrl || env.BASE_URL }}
        run: npx wdio run wdio.conf.js

      # Upload WDIO HTML report artifacts even if tests fail
      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-html-reports
          path: |
            _results_/test-results/**
          if-no-files-found: warn

      - name: Publish JUnit test results to UI
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2
        with:
          files: _results_/junit/*.xml

      - name: Generate Allure report
        if: always()
        run: npx allure generate _results_/allure-raw --clean -o _results_/allure-report

      - name: Upload Allure results and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            _results_/allure-raw/**
            _results_/allure-report/**
          if-no-files-found: warn

      - name: Add report info to job summary
        if: always()
        shell: bash
        run: |
          echo "### WDIO HTML Reports" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: wdio-html-reports" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download from the 'Artifacts' section of this run." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Allure Reports" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: allure-report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Includes both raw allure results and generated HTML report." >> "$GITHUB_STEP_SUMMARY"
