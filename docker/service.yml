name: smart-incident-reporting
services:
  webapp:
    image: smart-incident-reporting:${TAG:-latest}
    container_name: smart-incident-reporting-webapp
    build:
      context: ../
      dockerfile: dockerfile
      args:
        - GA_ID
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379