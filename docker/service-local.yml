name: smart-incident-reporting-local
secrets:
  WEBAPP_ENV:
    file: ./secrets/WEBAPP_ENV
services:
  webapp:
    image: smart-incident-reporting:${TAG:-latest}
    build:
      context: ../
      dockerfile: dockerfile
      target: development
      args:
        - GA_ID
    ports:
      - "8000:8000"
    secrets:
      - WEBAPP_ENV
    entrypoint: [ '/bin/sh', '-c' ]
    command:
      - "source /run/secrets/WEBAPP_ENV && export NODE_ENV=development && npm run dev"