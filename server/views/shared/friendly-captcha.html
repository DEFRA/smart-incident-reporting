<input type="hidden" id="javascriptEnabled" name="javascriptEnabled" value="false">
<script>
  document.getElementById('javascriptEnabled').value = 'true'
</script>

{% if captchaEnabled and not friendlyCaptchaCompleted %}
  <div id="friendly-captcha-container" class="govuk-visually-hidden" aria-hidden="true">
    <div class="govuk-body frc-captcha govuk-!-margin-bottom-4" id="friendly-captcha" data-sitekey="{{captchaSiteKey}}" data-start="auto"></div>
    <p class="govuk-body govuk-hint">
      Friendly Captcha checks that you aren't a robot. Find out how to use it in our <a href="/privacy-notice" class="govuk-link">privacy notice</a>
    </p>
  </div>

  <script>
    console.log('[Friendly Captcha] diagnostics active')
    document.addEventListener('frc:widget.statechange', ({ detail }) => {
      console.log('[Friendly Captcha] state', {
        state: detail.state,
        response: detail.response?.startsWith('.') ? detail.response.split('~')[0] : detail.response ? 'token-present' : 'missing',
        error: detail.error
      })
    })

    document.addEventListener('submit', (event) => {
      const response = event.target.querySelector('[name="frc-captcha-response"]')?.value
      console.log('[Friendly Captcha] form submit', {
        response: response?.startsWith('.') ? response : response ? 'token-present' : 'missing'
      })
    }, true)
  </script>

  <script type="module" src="{{ assetPath }}/js/site.min.js" async defer></script>
  <script nomodule src="{{ assetPath }}/js/site.compat.min.js" async defer></script>
{% endif %}
